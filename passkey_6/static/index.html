<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passkey / Windows Hello デモ</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#d0d0d0; --accent:#0b5fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#eee; --muted:#999; --line:#3a3a3a; --accent:#5b9bff; }
  }
  body { font-family: system-ui, "Yu Gothic UI", sans-serif; background:var(--bg); color:var(--fg);
         max-width:420px; margin:48px auto; padding:0 16px; }
  input, button { font:inherit; padding:10px 12px; border-radius:6px; border:1px solid var(--line);
                  background:var(--bg); color:var(--fg); width:100%; box-sizing:border-box; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; margin-top:8px; }
  button.sub { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  #msg { margin-top:16px; color:var(--muted); white-space:pre-wrap; }
  .hidden { display:none; }
</style>
</head>
<body>
<h1>パスキー認証</h1>

<div id="guest">
  <input id="username" placeholder="ユーザー名" autocomplete="username webauthn">
  <button id="reg">パスキーを登録(Windows Hello)</button>
  <button id="login" class="sub">パスキーでログイン</button>
</div>

<div id="authed" class="hidden">
  <p><strong id="who"></strong> としてログイン中</p>
  <button id="logout" class="sub">ログアウト</button>
</div>

<div id="msg"></div>

<script>
const $ = (id) => document.getElementById(id);
const msg = (t) => ($("msg").textContent = t);

// base64url <-> ArrayBuffer
const b64uToBuf = (s) => {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  s += "=".repeat((4 - (s.length % 4)) % 4);
  return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)).buffer;
};
const bufToB64u = (buf) =>
  btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

async function post(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body ?? {}),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function register() {
  const username = $("username").value.trim();
  const { challenge_id, options } = await post("/api/register/start", { username });
  const pk = options.publicKey;
  pk.challenge = b64uToBuf(pk.challenge);
  pk.user.id = b64uToBuf(pk.user.id);
  (pk.excludeCredentials || []).forEach((c) => (c.id = b64uToBuf(c.id)));
  // Windows Hello(プラットフォーム認証器)を優先
  pk.authenticatorSelection = { ...(pk.authenticatorSelection || {}), authenticatorAttachment: "platform" };

  const cred = await navigator.credentials.create({ publicKey: pk });
  await post("/api/register/finish", {
    challenge_id,
    credential: {
      id: cred.id,
      rawId: bufToB64u(cred.rawId),
      type: cred.type,
      response: {
        attestationObject: bufToB64u(cred.response.attestationObject),
        clientDataJSON: bufToB64u(cred.response.clientDataJSON),
      },
      extensions: cred.getClientExtensionResults(),
    },
  });
  msg("登録しました。続けてログインできます。");
}

async function login() {
  const username = $("username").value.trim();
  const { challenge_id, options } = await post("/api/login/start", { username });
  const pk = options.publicKey;
  pk.challenge = b64uToBuf(pk.challenge);
  (pk.allowCredentials || []).forEach((c) => (c.id = b64uToBuf(c.id)));

  const cred = await navigator.credentials.get({ publicKey: pk });
  await post("/api/login/finish", {
    challenge_id,
    credential: {
      id: cred.id,
      rawId: bufToB64u(cred.rawId),
      type: cred.type,
      response: {
        authenticatorData: bufToB64u(cred.response.authenticatorData),
        clientDataJSON: bufToB64u(cred.response.clientDataJSON),
        signature: bufToB64u(cred.response.signature),
        userHandle: cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null,
      },
      extensions: cred.getClientExtensionResults(),
    },
  });
  await refresh();
}

async function refresh() {
  const r = await fetch("/api/me");
  const ok = r.ok;
  $("guest").classList.toggle("hidden", ok);
  $("authed").classList.toggle("hidden", !ok);
  if (ok) { $("who").textContent = (await r.json()).username; msg(""); }
}

const wrap = (fn) => async () => { try { await fn(); } catch (e) { msg("エラー: " + e.message); } };
$("reg").onclick = wrap(register);
$("login").onclick = wrap(login);
$("logout").onclick = wrap(async () => { await post("/api/logout"); await refresh(); });
refresh();
</script>
</body>
</html>
