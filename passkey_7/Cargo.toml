[package]
name = "passkey_axum"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.4"
axum = "0.8"
base64 = "0.23"
dotenvy = "0.15"
password-hash = { version = "0.5.0", features = ["getrandom"] }
rand_core = "0.6"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# danger-allow-state-serialisation: チャレンジ状態を DB に JSON 保存するために必要
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }
